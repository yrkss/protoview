<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1 class="header-title">Это что за протокол?</h1>
                <p class="header-subtitle">Справочник сетевых протоколов</p>
            </div>
        </header>

        <main class="main-content">
            <section class="search-section">
                <div class="search-wrapper">
                    <div class="search-input-container">
                        <span class="search-icon">🔍</span>
                        <input
                            type="text"
                            id="searchInput"
                            class="search-input"
                            placeholder="Начните вводить название протокола..."
                            autocomplete="off"
                        />
                        <button id="clearButton" class="clear-button" aria-label="Очистить">✕</button>
                    </div>
                    <div id="suggestions" class="suggestions-list"></div>
                </div>
            </section>

            <section id="resultContainer" class="result-container">
                <div class="empty-state">
                    <div class="empty-icon">📡</div>
                    <h2>Выберите протокол</h2>
                    <p>Начните вводить название в поисковой строке, чтобы увидеть информацию о протоколе</p>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>Данные обновляются вручную. Все протоколы имеют ссылки на официальные спецификации.</p>
            <button id="clearCacheBtn" class="cache-clear-btn" title="Принудительно обновить данные протоколов">
                🔄 Обновить данные
            </button>
        </footer>
    </div>

    // ============================================================
    //  ПРИНУДИТЕЛЬНОЕ СБРАСЫВАНИЕ КЭША
    // ============================================================
    (function() {
        const DATA_VERSION = '2.0.2';
        const STORAGE_KEY = 'protocol_viewer_version';
        
        const storedVersion = localStorage.getItem(STORAGE_KEY);
        if (storedVersion !== DATA_VERSION) {
            console.log(`🔄 Обнаружена новая версия данных (${DATA_VERSION}), сбрасываю кэш...`);
            
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (let name of names) {
                        caches.delete(name);
                    }
                });
            }
            
            const keysToKeep = [STORAGE_KEY];
            for (let key in localStorage) {
                if (!keysToKeep.includes(key)) {
                    localStorage.removeItem(key);
                }
            }
            
            localStorage.setItem(STORAGE_KEY, DATA_VERSION);
            console.log('✅ Кэш сброшен, данные обновлены');
            window.location.reload(true);
        }
    })();

    //  ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ
    // ============================================================
    function findProtocols(query) {
        if (!query || query.trim() === '') {
            return [];
        }

        const q = query.toLowerCase().trim();
        const results = [];

        for (const proto of PROTOCOLS) {
            const nameMatch = proto.name.toLowerCase().includes(q);
            const abbrMatch = proto.abbreviation.toLowerCase().includes(q);
            const idMatch = proto.id.toLowerCase().includes(q);

            if (nameMatch || abbrMatch || idMatch) {
                results.push(proto);
            }
        }

        results.sort((a, b) => {
            const aAbbr = a.abbreviation.toLowerCase();
            const bAbbr = b.abbreviation.toLowerCase();

            if (aAbbr === q && bAbbr !== q) return -1;
            if (bAbbr === q && aAbbr !== q) return 1;
            if (aAbbr.startsWith(q) && !bAbbr.startsWith(q)) return -1;
            if (bAbbr.startsWith(q) && !aAbbr.startsWith(q)) return 1;

            return a.name.localeCompare(b.name);
        });

        return results;
    }

    function getProtocolById(id) {
        return PROTOCOLS.find((p) => p.id === id) || null;
    }

    // ============================================================
    //  ОТЛАДКА
    // ============================================================
    console.log('🌐 Protocol Viewer v3.2 — Обновлённый дизайн');
    console.log(`📦 Загружено протоколов: ${PROTOCOLS.length}`);

    // ============================================================
    //  UI ЛОГИКА
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        console.log('✅ DOM загружен, инициализация...');

        const searchInput = document.getElementById('searchInput');
        const suggestionsList = document.getElementById('suggestions');
        const resultContainer = document.getElementById('resultContainer');
        const clearButton = document.getElementById('clearButton');
        const clearCacheBtn = document.getElementById('clearCacheBtn');

        let activeIndex = -1;
        let currentSuggestions = [];

        // ---- ОТОБРАЖЕНИЕ ПРОТОКОЛА ----
        function renderProtocol(protocol) {
            if (!protocol) {
                resultContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📡</div>
                        <h2>Протокол не найден</h2>
                        <p>Попробуйте изменить запрос или выбрать другой протокол</p>
                    </div>
                `;
                return;
            }

            const layerNames = {
                7: 'Прикладной',
                6: 'Сеансовый / Представительский',
                5: 'Сеансовый',
                4: 'Транспортный',
                3: 'Сетевой',
                2: 'Канальный',
                1: 'Физический'
            };

            const layerDisplay = protocol.layerName || layerNames[protocol.layer] || `Уровень ${protocol.layer}`;

            let detailsHtml = '';
            if (protocol.details && Object.keys(protocol.details).length > 0) {
                for (const [label, value] of Object.entries(protocol.details)) {
                    detailsHtml += `
                        <div class="detail-item">
                            <span class="detail-label">${label}</span>
                            <span class="detail-value">${value}</span>
                        </div>
                    `;
                }
            }

            let linksHtml = '';
            if (protocol.links && protocol.links.length > 0) {
                linksHtml = `<div class="protocol-links-title">📎 Спецификации и документация</div>`;
                for (const link of protocol.links) {
                    linksHtml += `
                        <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="link-button">
                            <span class="link-icon">🔗</span> ${link.title}
                        </a>
                    `;
                }
            } else {
                linksHtml = `
                    <div class="protocol-links-title">📎 Ссылки</div>
                    <span style="color: var(--color-text-muted); font-size: 14px;">Спецификации временно отсутствуют</span>
                `;
            }

            resultContainer.innerHTML = `
                <div class="protocol-card">
                    <div class="protocol-header">
                        <div class="protocol-title-group">
                            <span class="protocol-name">${protocol.abbreviation}</span>
                            <span class="protocol-abbr">${protocol.name}</span>
                        </div>
                        <span class="protocol-layer-badge">OSI ${protocol.layer} — ${layerDisplay}</span>
                    </div>

                    <div class="protocol-description">
                        ${protocol.description}
                    </div>

                    <div class="protocol-details">
                        ${detailsHtml}
                    </div>

                    <div class="protocol-links">
                        ${linksHtml}
                    </div>
                </div>
            `;
        }

        // ---- ПОИСК И СОВПАДЕНИЯ ----
        function performSearch(query) {
            const results = findProtocols(query);
            currentSuggestions = results;
            activeIndex = -1;
            renderSuggestions(results);

            if (results.length === 1 && query.trim().length > 0) {
                renderProtocol(results[0]);
            } else if (results.length === 0 && query.trim().length > 0) {
                resultContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <h2>Ничего не найдено</h2>
                        <p>Попробуйте изменить запрос или проверьте орфографию</p>
                    </div>
                `;
            } else if (query.trim() === '') {
                resultContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📡</div>
                        <h2>Выберите протокол</h2>
                        <p>Начните вводить название в поисковой строке, чтобы увидеть информацию о протоколе</p>
                    </div>
                `;
            }
        }

        function renderSuggestions(results) {
            if (results.length === 0) {
                suggestionsList.classList.remove('active');
                return;
            }

            let html = '';
            const layerNames = {
                7: 'Прикладной',
                6: 'Сеансовый',
                5: 'Сеансовый',
                4: 'Транспортный',
                3: 'Сетевой',
                2: 'Канальный',
                1: 'Физический'
            };

            for (let i = 0; i < results.length; i++) {
                const p = results[i];
                const layerDisplay = p.layerName || layerNames[p.layer] || `L${p.layer}`;
                const activeClass = i === activeIndex ? 'active' : '';
                html += `
                    <div class="suggestion-item ${activeClass}" data-index="${i}" data-id="${p.id}">
                        <span class="suggestion-name">${p.abbreviation}</span>
                        <span class="suggestion-abbr">${p.name}</span>
                        <span class="suggestion-layer">OSI ${p.layer} · ${layerDisplay}</span>
                    </div>
                `;
            }

            suggestionsList.innerHTML = html;
            suggestionsList.classList.add('active');

            suggestionsList.querySelectorAll('.suggestion-item').forEach((el) => {
                el.addEventListener('click', function() {
                    const id = this.dataset.id;
                    const protocol = getProtocolById(id);
                    if (protocol) {
                        searchInput.value = protocol.abbreviation;
                        renderProtocol(protocol);
                        suggestionsList.classList.remove('active');
                        clearButton.classList.add('visible');
                    }
                });
            });
        }

        // ---- ОБНОВЛЕНИЕ ПОИСКА ----
        function updateSearch() {
            const query = searchInput.value;

            if (query.trim() === '') {
                clearButton.classList.remove('visible');
                suggestionsList.classList.remove('active');
                resultContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📡</div>
                        <h2>Выберите протокол</h2>
                        <p>Начните вводить название в поисковой строке, чтобы увидеть информацию о протоколе</p>
                    </div>
                `;
                return;
            }

            clearButton.classList.add('visible');
            performSearch(query);
        }

        // ---- ОЧИСТКА ----
        function clearSearch() {
            searchInput.value = '';
            searchInput.focus();
            clearButton.classList.remove('visible');
            suggestionsList.classList.remove('active');
            resultContainer.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📡</div>
                    <h2>Выберите протокол</h2>
                    <p>Начните вводить название в поисковой строке, чтобы увидеть информацию о протоколе</p>
                </div>
            `;
            activeIndex = -1;
            currentSuggestions = [];
        }

        // ---- КЛАВИАТУРНАЯ НАВИГАЦИЯ ----
        function navigateSuggestions(direction) {
            if (currentSuggestions.length === 0) return;

            activeIndex += direction;
            if (activeIndex < 0) activeIndex = currentSuggestions.length - 1;
            if (activeIndex >= currentSuggestions.length) activeIndex = 0;

            const items = suggestionsList.querySelectorAll('.suggestion-item');
            items.forEach((el, i) => {
                el.classList.toggle('active', i === activeIndex);
            });

            const activeEl = items[activeIndex];
            if (activeEl) {
                activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        function selectActiveSuggestion() {
            if (activeIndex < 0 || activeIndex >= currentSuggestions.length) return;
            const protocol = currentSuggestions[activeIndex];
            if (protocol) {
                searchInput.value = protocol.abbreviation;
                renderProtocol(protocol);
                suggestionsList.classList.remove('active');
                clearButton.classList.add('visible');
                activeIndex = -1;
            }
        }

        // ---- ПРИНУДИТЕЛЬНЫЙ СБРОС КЭША ----
        function forceClearCache() {
            const version = localStorage.getItem('protocol_viewer_version') || '0';
            const newVersion = '3.2.2';
            localStorage.setItem('protocol_viewer_version', newVersion);
            console.log(`🔄 Принудительный сброс кэша: ${version} → ${newVersion}`);

            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (let name of names) {
                        caches.delete(name);
                    }
                });
            }

            const btn = document.getElementById('clearCacheBtn');
            const originalText = btn.textContent;
            btn.textContent = '✅ Обновлено!';
            btn.style.background = '#4d6bfe';
            btn.style.color = 'white';
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '';
                btn.style.color = '';
            }, 2000);

            setTimeout(() => {
                window.location.reload(true);
            }, 1000);
        }

        // ---- ПОДПИСКА НА СОБЫТИЯ ----
        searchInput.addEventListener('input', updateSearch);

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (!suggestionsList.classList.contains('active')) {
                    if (searchInput.value.trim().length > 0) {
                        performSearch(searchInput.value);
                    }
                    return;
                }
                navigateSuggestions(1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (!suggestionsList.classList.contains('active')) return;
                navigateSuggestions(-1);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (suggestionsList.classList.contains('active') && activeIndex >= 0) {
                    selectActiveSuggestion();
                } else if (searchInput.value.trim().length > 0) {
                    const results = findProtocols(searchInput.value);
                    if (results.length > 0) {
                        renderProtocol(results[0]);
                        suggestionsList.classList.remove('active');
                    }
                }
            } else if (e.key === 'Escape') {
                suggestionsList.classList.remove('active');
                activeIndex = -1;
                searchInput.blur();
            }
        });

        clearButton.addEventListener('click', clearSearch);

        if (clearCacheBtn) {
            clearCacheBtn.addEventListener('click', forceClearCache);
        }

        document.addEventListener('click', function(e) {
            const wrapper = document.querySelector('.search-wrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                suggestionsList.classList.remove('active');
            }
        });

        // ---- ЗАГРУЗКА ПЕРВОГО ПРОТОКОЛА ----
        const defaultProtocol = getProtocolById('http');
        if (defaultProtocol) {
            renderProtocol(defaultProtocol);
            searchInput.value = defaultProtocol.abbreviation;
            clearButton.classList.add('visible');
            console.log('✅ Загружен протокол по умолчанию: HTTP');
        }

        console.log('✅ Protocol Viewer v3.2 готов к работе!');
    });
    </script>
</body>
</html>
