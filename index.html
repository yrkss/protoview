<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Protocol Viewer — сетевые протоколы</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🌐</span>
                    <h1>Protocol Viewer</h1>
                </div>
                <p class="header-subtitle">Справочник сетевых протоколов</p>
            </div>
        </header>

        <main class="main-content">
            <section class="search-section">
                <div class="search-wrapper">
                    <div class="search-input-container">
                        <span class="search-icon">🔍</span>
                        <input
                            type="text"
                            id="searchInput"
                            class="search-input"
                            placeholder="Начните вводить название протокола..."
                            autocomplete="off"
                        />
                        <button id="clearButton" class="clear-button" aria-label="Очистить">✕</button>
                    </div>
                    <div id="suggestions" class="suggestions-list"></div>
                </div>
            </section>

            <section id="resultContainer" class="result-container">
                <div class="empty-state">
                    <div class="empty-icon">📡</div>
                    <h2>Выберите протокол</h2>
                    <p>Начните вводить название в поисковой строке, чтобы увидеть информацию о протоколе</p>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>Данные обновляются вручную. Все протоколы имеют ссылки на официальные спецификации.</p>
        </footer>
    </div>

    <!-- Исправленные пути для GitHub Pages -->
    <script src="/protoview/protocols.js"></script>
    <script src="/protoview/script.js"></script>
</body>
</html>
