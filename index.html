<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Protocol Viewer — сетевые протоколы</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <div class="logo">
                    <span class="logo-icon">🌐</span>
                    <h1>Protocol Viewer</h1>
                </div>
                <p class="header-subtitle">Справочник сетевых протоколов</p>
            </div>
        </header>

        <main class="main-content">
            <section class="search-section">
                <div class="search-wrapper">
                    <div class="search-input-container">
                        <span class="search-icon">🔍</span>
                        <input
                            type="text"
                            id="searchInput"
                            class="search-input"
                            placeholder="Начните вводить название протокола..."
                            autocomplete="off"
                        />
                        <button id="clearButton" class="clear-button" aria-label="Очистить">✕</button>
                    </div>
                    <div id="suggestions" class="suggestions-list"></div>
                </div>
            </section>

            <section id="resultContainer" class="result-container">
                <div class="empty-state">
                    <div class="empty-icon">📡</div>
                    <h2>Выберите протокол</h2>
                    <p>Начните вводить название в поисковой строке, чтобы увидеть информацию о протоколе</p>
                </div>
            </section>
        </main>

        <footer class="app-footer">
            <p>Данные обновляются вручную. Все протоколы имеют ссылки на официальные спецификации.</p>
        </footer>
    </div>

    <!-- ВСЕ СКРИПТЫ В ОДНОМ ФАЙЛЕ ДЛЯ НАДЕЖНОСТИ -->
    <script>
    // ============================================================
    //  БАЗА ДАННЫХ ПРОТОКОЛОВ (ВСТРОЕННАЯ)
    // ============================================================
    const PROTOCOLS = [
        {
            id: 'http',
            name: 'HyperText Transfer Protocol',
            abbreviation: 'HTTP',
            layer: 7,
            layerName: 'Прикладной',
            description: 'Протокол прикладного уровня для передачи гипертекстовых документов (веб-страниц). Работает поверх TCP. Используется для загрузки веб-страниц, API-запросов и передачи данных в интернете. Версия HTTP/3 работает поверх QUIC.',
            details: {
                'Порт по умолчанию': '80 (HTTP), 443 (HTTPS)',
                'Транспорт': 'TCP (HTTP/1.1, HTTP/2), UDP (HTTP/3)',
                'Кодировка': 'Текст (ASCII) / бинарный (HTTP/2)',
                'Статус': 'Активный, постоянно развивается'
            },
            links: [
                { title: 'RFC 9110 — HTTP Semantics', url: 'https://datatracker.ietf.org/doc/html/rfc9110' },
                { title: 'RFC 9112 — HTTP/1.1', url: 'https://datatracker.ietf.org/doc/html/rfc9112' },
                { title: 'RFC 9113 — HTTP/2', url: 'https://datatracker.ietf.org/doc/html/rfc9113' },
                { title: 'RFC 9114 — HTTP/3', url: 'https://datatracker.ietf.org/doc/html/rfc9114' }
            ]
        },
        {
            id: 'https',
            name: 'HyperText Transfer Protocol Secure',
            abbreviation: 'HTTPS',
            layer: 7,
            layerName: 'Прикладной',
            description: 'Защищённая версия HTTP, использующая TLS/SSL для шифрования трафика. Обеспечивает конфиденциальность, целостность и аутентификацию. Является стандартом для современных веб-сайтов и API.',
            details: {
                'Порт по умолчанию': '443',
                'Транспорт': 'TCP (TLS), UDP (QUIC + TLS)',
                'Шифрование': 'TLS 1.2 / 1.3',
                'Сертификаты': 'X.509 (PKI)'
            },
            links: [
                { title: 'RFC 2818 — HTTPS', url: 'https://datatracker.ietf.org/doc/html/rfc2818' },
                { title: 'RFC 8446 — TLS 1.3', url: 'https://datatracker.ietf.org/doc/html/rfc8446' }
            ]
        },
        {
            id: 'tcp',
            name: 'Transmission Control Protocol',
            abbreviation: 'TCP',
            layer: 4,
            layerName: 'Транспортный',
            description: 'Надёжный, ориентированный на соединение протокол транспортного уровня. Обеспечивает гарантированную доставку данных, контроль потока, управление перегрузками и восстановление потерянных пакетов. Основа большинства интернет-приложений.',
            details: {
                'Порт': 'Динамический (1–65535)',
                'Соединение': 'Трёхэтапное рукопожатие (SYN, SYN-ACK, ACK)',
                'Надёжность': 'ACK, таймауты, повторная передача',
                'Управление': 'Flow Control (Window), Congestion Control'
            },
            links: [
                { title: 'RFC 9293 — TCP', url: 'https://datatracker.ietf.org/doc/html/rfc9293' },
                { title: 'RFC 5681 — TCP Congestion Control', url: 'https://datatracker.ietf.org/doc/html/rfc5681' }
            ]
        },
        {
            id: 'udp',
            name: 'User Datagram Protocol',
            abbreviation: 'UDP',
            layer: 4,
            layerName: 'Транспортный',
            description: 'Простой, ненадёжный протокол без установления соединения. Не гарантирует доставку, порядок или целостность данных. Используется в приложениях, где скорость важнее надёжности (видео, аудио, DNS, игры).',
            details: {
                'Порт': 'Динамический (1–65535)',
                'Соединение': 'Нет (без соединения)',
                'Надёжность': 'Нет (best-effort)',
                'Применение': 'Стриминг, VoIP, DNS, QUIC'
            },
            links: [
                { title: 'RFC 768 — UDP', url: 'https://datatracker.ietf.org/doc/html/rfc768' },
                { title: 'RFC 8085 — UDP Usage Guidelines', url: 'https://datatracker.ietf.org/doc/html/rfc8085' }
            ]
        },
        {
            id: 'dns',
            name: 'Domain Name System',
            abbreviation: 'DNS',
            layer: 7,
            layerName: 'Прикладной',
            description: 'Распределённая система для преобразования доменных имён (например, example.com) в IP-адреса. Работает поверх UDP (иногда TCP). Является критически важным компонентом интернета, обеспечивающим маршрутизацию запросов.',
            details: {
                'Порт по умолчанию': '53 (UDP/TCP)',
                'Транспорт': 'UDP (основной), TCP (зонные трансферы)',
                'Типы записей': 'A, AAAA, CNAME, MX, TXT, NS, PTR, SOA',
                'Корневые серверы': '13 корневых серверов (A-M)'
            },
            links: [
                { title: 'RFC 1035 — DNS', url: 'https://datatracker.ietf.org/doc/html/rfc1035' },
                { title: 'RFC 2181 — DNS Clarifications', url: 'https://datatracker.ietf.org/doc/html/rfc2181' },
                { title: 'RFC 8484 — DNS over HTTPS', url: 'https://datatracker.ietf.org/doc/html/rfc8484' }
            ]
        },
        {
            id: 'ssh',
            name: 'Secure Shell',
            abbreviation: 'SSH',
            layer: 7,
            layerName: 'Прикладной',
            description: 'Защищённый протокол для удалённого управления серверами и безопасной передачи данных. Использует шифрование для защиты сессии. Заменяет небезопасные протоколы Telnet и rlogin.',
            details: {
                'Порт по умолчанию': '22',
                'Транспорт': 'TCP',
                'Шифрование': 'AES, ChaCha20, 3DES (устаревший)',
                'Аутентификация': 'Пароль, открытый ключ, Kerberos'
            },
            links: [
                { title: 'RFC 4251 — SSH Protocol', url: 'https://datatracker.ietf.org/doc/html/rfc4251' },
                { title: 'RFC 4252 — SSH Authentication', url: 'https://datatracker.ietf.org/doc/html/rfc4252' }
            ]
        },
        {
            id: 'smtp',
            name: 'Simple Mail Transfer Protocol',
            abbreviation: 'SMTP',
            layer: 7,
            layerName: 'Прикладной',
            description: 'Протокол для отправки электронной почты между почтовыми серверами. Работает поверх TCP. Используется для передачи сообщений от клиента к серверу и между серверами. Для получения почты используются POP3 или IMAP.',
            details: {
                'Порт по умолчанию': '25, 587 (Submission), 465 (SMTPS)',
                'Транспорт': 'TCP',
                'Команды': 'HELO, MAIL FROM, RCPT TO, DATA, QUIT',
                'Расширения': 'ESMTP (RFC 5321)'
            },
            links: [
                { title: 'RFC 5321 — SMTP', url: 'https://datatracker.ietf.org/doc/html/rfc5321' },
                { title: 'RFC 5322 — Email Format', url: 'https://datatracker.ietf.org/doc/html/rfc5322' }
            ]
        },
        {
            id: 'dhcp',
            name: 'Dynamic Host Configuration Protocol',
            abbreviation: 'DHCP',
            layer: 7,
            layerName: 'Прикладной',
            description: 'Протокол для автоматической настройки сетевых параметров устройств: IP-адрес, маска подсети, шлюз, DNS-серверы. Работает поверх UDP. Упрощает управление IP-адресами в локальных сетях.',
            details: {
                'Порт по умолчанию': '67 (сервер), 68 (клиент)',
                'Транспорт': 'UDP',
                'Типы сообщений': 'DHCPDISCOVER, DHCPOFFER, DHCPREQUEST, DHCPACK',
                'Опции': 'Option 1 (Subnet Mask), Option 3 (Router), Option 6 (DNS)'
            },
            links: [
                { title: 'RFC 2131 — DHCP', url: 'https://datatracker.ietf.org/doc/html/rfc2131' },
                { title: 'RFC 2132 — DHCP Options', url: 'https://datatracker.ietf.org/doc/html/rfc2132' }
            ]
        },
        {
            id: 'ftp',
            name: 'File Transfer Protocol',
            abbreviation: 'FTP',
            layer: 7,
            layerName: 'Прикладной',
            description: 'Протокол для передачи файлов между клиентом и сервером. Использует два канала: управляющий (команды) и данных (файлы). В настоящее время вытесняется более безопасными протоколами (SFTP, FTPS).',
            details: {
                'Порт по умолчанию': '21 (управление), 20 (данные)',
                'Транспорт': 'TCP',
                'Режимы': 'Активный / Пассивный',
                'Безопасность': 'Нет (передаётся в открытом виде)'
            },
            links: [
                { title: 'RFC 959 — FTP', url: 'https://datatracker.ietf.org/doc/html/rfc959' },
                { title: 'RFC 2428 — FTP Extensions', url: 'https://datatracker.ietf.org/doc/html/rfc2428' }
            ]
        },
        {
            id: 'tls',
            name: 'Transport Layer Security',
            abbreviation: 'TLS',
            layer: 6,
            layerName: 'Сеансовый',
            description: 'Криптографический протокол для защиты связи в интернете. Обеспечивает конфиденциальность, целостность и аутентификацию. Используется в HTTPS, почте, мессенджерах и многих других приложениях. Преемник SSL.',
            details: {
                'Версии': 'TLS 1.0 (устаревший), 1.1 (устаревший), 1.2, 1.3',
                'Порт': '443 (HTTPS), 465 (SMTPS), 993 (IMAPS)',
                'Шифрование': 'AES-GCM, ChaCha20-Poly1305',
                'Рукопожатие': '1-RTT (TLS 1.3), 0-RTT (опционально)'
            },
            links: [
                { title: 'RFC 8446 — TLS 1.3', url: 'https://datatracker.ietf.org/doc/html/rfc8446' },
                { title: 'RFC 5246 — TLS 1.2', url: 'https://datatracker.ietf.org/doc/html/rfc5246' }
            ]
        },
        {
            id: 'websocket',
            name: 'WebSocket Protocol',
            abbreviation: 'WebSocket',
            layer: 7,
            layerName: 'Прикладной',
            description: 'Протокол для полнодуплексной связи между клиентом и сервером поверх TCP. Используется в веб-приложениях для реального времени: чаты, игры, биржевые данные. Работает через HTTP-рукопожатие, затем переключается на бинарный протокол.',
            details: {
                'Порт по умолчанию': '80 (ws), 443 (wss)',
                'Транспорт': 'TCP (ws), TLS (wss)',
                'Фреймы': 'Текст (UTF-8) или бинарные данные',
                'Поддержка': 'Все современные браузеры'
            },
            links: [
                { title: 'RFC 6455 — WebSocket', url: 'https://datatracker.ietf.org/doc/html/rfc6455' },
                { title: 'RFC 7692 — WebSocket Compression', url: 'https://datatracker.ietf.org/doc/html/rfc7692' }
            ]
        }
    ];

    // ============================================================
    //  ФУНКЦИИ ПОИСКА
    // ============================================================
    function findProtocols(query) {
        if (!query || query.trim() === '') return [];
        
        const q = query.toLowerCase().trim();
        const results = [];
        
        for (const proto of PROTOCOLS) {
            const nameMatch = proto.name.toLowerCase().includes(q);
            const abbrMatch = proto.abbreviation.toLowerCase().includes(q);
            const idMatch = proto.id.toLowerCase().includes(q);
            
            if (nameMatch || abbrMatch || idMatch) {
                results.push(proto);
            }
        }
        
        results.sort((a, b) => {
            const aAbbr = a.abbreviation.toLowerCase();
            const bAbbr = b.abbreviation.toLowerCase();
            
            if (aAbbr === q && bAbbr !== q) return -1;
            if (bAbbr === q && aAbbr !== q) return 1;
            if (aAbbr.startsWith(q) && !bAbbr.startsWith(q)) return -1;
            if (bAbbr.startsWith(q) && !aAbbr.startsWith(q)) return 1;
            
            return a.name.localeCompare(b.name);
        });
        
        return results;
    }

    function getProtocolById(id) {
        return PROTOCOLS.find(p => p.id === id) || null;
    }

    // ============================================================
    //  ОТЛАДКА
    // ============================================================
    console.log('🌐 Protocol Viewer v2.0');
    console.log(`📦 Загружено протоколов: ${PROTOCOLS.length}`);
    console.log('📋 Доступные протоколы:', PROTOCOLS.map(p => p.abbreviation).join(', '));

    // ============================================================
    //  UI ЛОГИКА
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        console.log('✅ DOM загружен, инициализация...');
        
        const searchInput = document.getElementById('searchInput');
        const suggestionsList = document.getElementById('suggestions');
        const resultContainer = document.getElementById('resultContainer');
        const clearButton = document.getElementById('clearButton');
        
        console.log('🔍 Элементы найдены:', {
            searchInput: !!searchInput,
            suggestionsList: !!suggestionsList,
            resultContainer: !!resultContainer,
            clearButton: !!clearButton
        });

        let activeIndex = -1;
        let currentSuggestions = [];

        // ---- ОТОБРАЖЕНИЕ ПРОТОКОЛА ----
        function renderProtocol(protocol) {
            console.log('📄 Рендеринг протокола:', protocol?.abbreviation || 'null');
            
            if (!protocol) {
                resultContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📡</div>
                        <h2>Протокол не найден</h2>
                        <p>Попробуйте изменить запрос или выбрать другой протокол</p>
                    </div>
                `;
                return;
            }

            const layerNames = {
                7: 'Прикладной',
                6: 'Сеансовый / Представительский',
                5: 'Сеансовый',
                4: 'Транспортный',
                3: 'Сетевой',
                2: 'Канальный',
                1: 'Физический'
            };

            const layerDisplay = protocol.layerName || layerNames[protocol.layer] || `Уровень ${protocol.layer}`;

            let detailsHtml = '';
            if (protocol.details && Object.keys(protocol.details).length > 0) {
                for (const [label, value] of Object.entries(protocol.details)) {
                    detailsHtml += `
                        <div class="detail-item">
                            <span class="detail-label">${label}</span>
                            <span class="detail-value">${value}</span>
                        </div>
                    `;
                }
            }

            let linksHtml = '';
            if (protocol.links && protocol.links.length > 0) {
                linksHtml = `<div class="protocol-links-title">📎 Спецификации и документация</div>`;
                for (const link of protocol.links) {
                    linksHtml += `
                        <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="link-button">
                            <span class="link-icon">🔗</span> ${link.title}
                        </a>
                    `;
                }
            } else {
                linksHtml = `
                    <div class="protocol-links-title">📎 Ссылки</div>
                    <span style="color: var(--color-text-muted); font-size: 14px;">Спецификации временно отсутствуют</span>
                `;
            }

            resultContainer.innerHTML = `
                <div class="protocol-card">
                    <div class="protocol-header">
                        <div class="protocol-title-group">
                            <span class="protocol-name">${protocol.abbreviation}</span>
                            <span class="protocol-abbr">${protocol.name}</span>
                        </div>
                        <span class="protocol-layer-badge">OSI ${protocol.layer} — ${layerDisplay}</span>
                    </div>

                    <div class="protocol-description">
                        ${protocol.description}
                    </div>

                    <div class="protocol-details">
                        ${detailsHtml}
                    </div>

                    <div class="protocol-links">
                        ${linksHtml}
                    </div>
                </div>
            `;
        }

        // ---- ПОИСК И СОВПАДЕНИЯ ----
        function performSearch(query) {
            console.log('🔎 Поиск:', query);
            const results = findProtocols(query);
            currentSuggestions = results;
            activeIndex = -1;
            renderSuggestions(results);

            if (results.length === 1 && query.trim().length > 0) {
                renderProtocol(results[0]);
            } else if (results.length === 0 && query.trim().length > 0) {
                resultContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <h2>Ничего не найдено</h2>
                        <p>Попробуйте изменить запрос или проверьте орфографию</p>
                    </div>
                `;
            } else if (query.trim() === '') {
                resultContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📡</div>
                        <h2>Выберите протокол</h2>
                        <p>Начните вводить название в поисковой строке, чтобы увидеть информацию о протоколе</p>
                    </div>
                `;
            }
        }

        function renderSuggestions(results) {
            if (results.length === 0) {
                suggestionsList.classList.remove('active');
                return;
            }

            let html = '';
            const layerNames = {
                7: 'Прикладной',
                6: 'Сеансовый',
                5: 'Сеансовый',
                4: 'Транспортный',
                3: 'Сетевой',
                2: 'Канальный',
                1: 'Физический'
            };

            for (let i = 0; i < results.length; i++) {
                const p = results[i];
                const layerDisplay = p.layerName || layerNames[p.layer] || `L${p.layer}`;
                const activeClass = i === activeIndex ? 'active' : '';
                html += `
                    <div class="suggestion-item ${activeClass}" data-index="${i}" data-id="${p.id}">
                        <span class="suggestion-name">${p.abbreviation}</span>
                        <span class="suggestion-abbr">${p.name}</span>
                        <span class="suggestion-layer">OSI ${p.layer} · ${layerDisplay}</span>
                    </div>
                `;
            }

            suggestionsList.innerHTML = html;
            suggestionsList.classList.add('active');

            suggestionsList.querySelectorAll('.suggestion-item').forEach((el) => {
                el.addEventListener('click', function() {
                    const id = this.dataset.id;
                    const protocol = getProtocolById(id);
                    if (protocol) {
                        searchInput.value = protocol.abbreviation;
                        renderProtocol(protocol);
                        suggestionsList.classList.remove('active');
                        clearButton.classList.add('visible');
                    }
                });
            });
        }

        // ---- ОБНОВЛЕНИЕ ПОИСКА ----
        function updateSearch() {
            const query = searchInput.value;
            console.log('🔄 Обновление поиска:', query);
            
            if (query.trim() === '') {
                clearButton.classList.remove('visible');
                suggestionsList.classList.remove('active');
                resultContainer.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">📡</div>
                        <h2>Выберите протокол</h2>
                        <p>Начните вводить название в поисковой строке, чтобы увидеть информацию о протоколе</p>
                    </div>
                `;
                return;
            }

            clearButton.classList.add('visible');
            performSearch(query);
        }

        // ---- ОЧИСТКА ----
        function clearSearch() {
            searchInput.value = '';
            searchInput.focus();
            clearButton.classList.remove('visible');
            suggestionsList.classList.remove('active');
            resultContainer.innerHTML = `
                <div class="empty-state">
                    <div class="empty-icon">📡</div>
                    <h2>Выберите протокол</h2>
                    <p>Начните вводить название в поисковой строке, чтобы увидеть информацию о протоколе</p>
                </div>
            `;
            activeIndex = -1;
            currentSuggestions = [];
        }

        // ---- КЛАВИАТУРНАЯ НАВИГАЦИЯ ----
        function navigateSuggestions(direction) {
            if (currentSuggestions.length === 0) return;

            activeIndex += direction;
            if (activeIndex < 0) activeIndex = currentSuggestions.length - 1;
            if (activeIndex >= currentSuggestions.length) activeIndex = 0;

            const items = suggestionsList.querySelectorAll('.suggestion-item');
            items.forEach((el, i) => {
                el.classList.toggle('active', i === activeIndex);
            });

            const activeEl = items[activeIndex];
            if (activeEl) {
                activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
            }
        }

        function selectActiveSuggestion() {
            if (activeIndex < 0 || activeIndex >= currentSuggestions.length) return;
            const protocol = currentSuggestions[activeIndex];
            if (protocol) {
                searchInput.value = protocol.abbreviation;
                renderProtocol(protocol);
                suggestionsList.classList.remove('active');
                clearButton.classList.add('visible');
                activeIndex = -1;
            }
        }

        // ---- ПОДПИСКА НА СОБЫТИЯ ----
        searchInput.addEventListener('input', updateSearch);

        searchInput.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                if (!suggestionsList.classList.contains('active')) {
                    if (searchInput.value.trim().length > 0) {
                        performSearch(searchInput.value);
                    }
                    return;
                }
                navigateSuggestions(1);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                if (!suggestionsList.classList.contains('active')) return;
                navigateSuggestions(-1);
            } else if (e.key === 'Enter') {
                e.preventDefault();
                if (suggestionsList.classList.contains('active') && activeIndex >= 0) {
                    selectActiveSuggestion();
                } else if (searchInput.value.trim().length > 0) {
                    const results = findProtocols(searchInput.value);
                    if (results.length > 0) {
                        renderProtocol(results[0]);
                        suggestionsList.classList.remove('active');
                    }
                }
            } else if (e.key === 'Escape') {
                suggestionsList.classList.remove('active');
                activeIndex = -1;
                searchInput.blur();
            }
        });

        clearButton.addEventListener('click', clearSearch);

        document.addEventListener('click', function(e) {
            const wrapper = document.querySelector('.search-wrapper');
            if (wrapper && !wrapper.contains(e.target)) {
                suggestionsList.classList.remove('active');
            }
        });

        // ---- ЗАГРУЗКА ПЕРВОГО ПРОТОКОЛА ----
        const defaultProtocol = getProtocolById('http');
        if (defaultProtocol) {
            renderProtocol(defaultProtocol);
            searchInput.value = defaultProtocol.abbreviation;
            clearButton.classList.add('visible');
            console.log('✅ Загружен протокол по умолчанию: HTTP');
        } else {
            console.warn('⚠️ Протокол HTTP не найден!');
        }

        console.log('✅ Protocol Viewer готов к работе!');
    });
    </script>
</body>
</html>
