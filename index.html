    (function() {
        const DATA_VERSION = '4.0.0';
        const STORAGE_KEY = 'protocol_viewer_version';
        
        const storedVersion = localStorage.getItem(STORAGE_KEY);
        if (storedVersion !== DATA_VERSION) {
            console.log(`🔄 Обнаружена новая версия данных (${DATA_VERSION}), сбрасываю кэш...`);
            
            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (let name of names) {
                        caches.delete(name);
                    }
                });
            }
            
            const keysToKeep = [STORAGE_KEY];
            for (let key in localStorage) {
                if (!keysToKeep.includes(key)) {
                    localStorage.removeItem(key);
                }
            }
            
            localStorage.setItem(STORAGE_KEY, DATA_VERSION);
            console.log('✅ Кэш сброшен, данные обновлены');
            window.location.reload(true);
        }
    })();

                'Стандарты': '802.11a/b/g/n/ac/ax (Wi-Fi 6), be (Wi-Fi 7)',
                'Частоты': '2.4 GHz, 5 GHz, 6 GHz',
                'Безопасность': 'WEP, WPA, WPA2, WPA3',
                'Скорости': 'До 9.6 Gbps (Wi-Fi 6)',
            },
            links: [
                { title: 'IEEE 802.11 — Wi-Fi', url: 'https://standards.ieee.org/ieee/802.11/' },
                { title: 'Wi-Fi Alliance', url: 'https://www.wi-fi.org/' },
            ],
        },
        {
            id: 'zigbee',
            name: 'Zigbee Protocol (IEEE 802.15.4)',
            abbreviation: 'Zigbee',
            layer: 2,
            layerName: 'Канальный',
            description:
                'Беспроводной протокол для IoT и домашней автоматизации. Работает на частотах 2.4 GHz, 915 MHz и 868 MHz. Поддерживает ячеистые сети (mesh) и низкое энергопотребление.',
            details: {
                'Стандарт': 'IEEE 802.15.4, Zigbee Alliance',
                'Частоты': '2.4 GHz (мировой), 915 MHz (Америка), 868 MHz (Европа)',
                'Скорости': '250 kbps (2.4 GHz), 40 kbps (915 MHz), 20 kbps (868 MHz)',
                'Топологии': 'Звезда, Дерево, Ячеистая (Mesh)',
            },
            links: [
                { title: 'Zigbee Alliance', url: 'https://csa-iot.org/' },
                { title: 'IEEE 802.15.4', url: 'https://standards.ieee.org/ieee/802.15.4/' },
            ],
        },
        {
            id: 'z-wave',
            name: 'Z-Wave Protocol',
            abbreviation: 'Z-Wave',
            layer: 2,
            layerName: 'Канальный',
            description:
                'Беспроводной протокол для домашней автоматизации. Работает на частотах 800-900 MHz (зависит от региона). Поддерживает ячеистые сети (mesh) и низкое энергопотребление.',
            details: {
                'Частоты': '868 MHz (Европа), 908 MHz (Америка), 921 MHz (Азия)',
                'Скорости': '9.6 kbps, 40 kbps, 100 kbps',
                'Топология': 'Ячеистая (Mesh) с маршрутизацией',
                'Диапазон': 'До 100 метров на открытом пространстве',
            },
            links: [
                { title: 'Z-Wave Alliance', url: 'https://z-wavealliance.org/' },
                { title: 'Z-Wave Protocol Overview', url: 'https://z-wavealliance.org/z-wave-technology/' },
            ],
        },
    ];

    // ============================================================
    //  ФУНКЦИИ
    // ============================================================
    function getProtocolById(id) {
        return PROTOCOLS.find((p) => p.id === id) || null;
    }

    // ============================================================
    //  UI ЛОГИКА
    // ============================================================
    document.addEventListener('DOMContentLoaded', function() {
        console.log('🌐 Protocol Viewer v4.0 — Исправленный дизайн');
        console.log(`📦 Загружено протоколов: ${PROTOCOLS.length}`);

        const searchInput = document.getElementById('searchInput');
        const clearButton = document.getElementById('clearButton');
        const protocolListContainer = document.getElementById('protocolList');
        const clearCacheBtn = document.getElementById('clearCacheBtn');

        let expandedProtocolId = null;

        // ---- ГРУППИРОВКА ПО УРОВНЯМ ----
        function groupProtocolsByLayer(protocols) {
            const groups = {};
            const layerOrder = [7, 6, 4, 3, 2];
            const layerNames = {
                7: 'Прикладной (Application)',
                6: 'Представительский (Presentation)',
                4: 'Транспортный (Transport)',
                3: 'Сетевой (Network)',
                2: 'Канальный (Data Link)',
            };

            for (const proto of protocols) {
                const layer = proto.layer;
                if (!groups[layer]) {
                    groups[layer] = [];
                }
                groups[layer].push(proto);
            }

            const sortedGroups = [];
            for (const layer of layerOrder) {
                if (groups[layer]) {
                    sortedGroups.push({
                        layer: layer,
                        name: layerNames[layer] || `Уровень ${layer}`,
                        protocols: groups[layer].sort((a, b) => a.abbreviation.localeCompare(b.abbreviation)),
                    });
                }
            }

            return sortedGroups;
        }

        // ---- РЕНДЕРИНГ СПИСКА ----
        function renderProtocolList(protocols) {
            const groups = groupProtocolsByLayer(protocols);
            let html = '';

            if (groups.length === 0) {
                html = `
                    <div class="empty-state">
                        <div class="empty-icon">🔍</div>
                        <h2>Ничего не найдено</h2>
                        <p>Попробуйте изменить запрос</p>
                    </div>
                `;
                protocolListContainer.innerHTML = html;
                return;
            }

            for (const group of groups) {
                html += `<div class="layer-group">`;
                html += `<div class="layer-header">`;
                html += `<span class="layer-number">Уровень ${group.layer}</span>`;
                html += `<span class="layer-name">${group.name}</span>`;
                html += `<span class="layer-count">${group.protocols.length}</span>`;
                html += `</div>`;
                html += `<div class="protocol-items">`;

                for (const proto of group.protocols) {
                    const isExpanded = expandedProtocolId === proto.id;
                    html += `<div class="protocol-item ${isExpanded ? 'expanded' : ''}" data-id="${proto.id}">`;
                    html += `<div class="protocol-header-clickable">`;
                    html += `<span class="protocol-abbr">${proto.abbreviation}</span>`;
                    html += `<span class="protocol-full-name">${proto.name}</span>`;
                    html += `<span class="protocol-expand-icon">${isExpanded ? '▾' : '▸'}</span>`;
                    html += `</div>`;

                    if (isExpanded) {
                        html += `<div class="protocol-details-expanded">`;
                        html += `<div class="protocol-description">${proto.description}</div>`;
                        
                        if (proto.details && Object.keys(proto.details).length > 0) {
                            html += `<div class="protocol-details-grid">`;
                            for (const [label, value] of Object.entries(proto.details)) {
                                html += `
                                    <div class="detail-item">
                                        <span class="detail-label">${label}</span>
                                        <span class="detail-value">${value}</span>
                                    </div>
                                `;
                            }
                            html += `</div>`;
                        }

                        if (proto.links && proto.links.length > 0) {
                            html += `<div class="protocol-links">`;
                            html += `<div class="protocol-links-title">📎 Спецификации и документация</div>`;
                            for (const link of proto.links) {
                                html += `
                                    <a href="${link.url}" target="_blank" rel="noopener noreferrer" class="link-button">
                                        <span class="link-icon">🔗</span> ${link.title}
                                    </a>
                                `;
                            }
                            html += `</div>`;
                        }
                        html += `</div>`;
                    }

                    html += `</div>`;
                }

                html += `</div>`;
                html += `</div>`;
            }

            protocolListContainer.innerHTML = html;

            // Обработчики кликов
            document.querySelectorAll('.protocol-header-clickable').forEach((header) => {
                header.addEventListener('click', function() {
                    const item = this.closest('.protocol-item');
                    const id = item.dataset.id;
                    
                    if (expandedProtocolId === id) {
                        expandedProtocolId = null;
                    } else {
                        expandedProtocolId = id;
                    }
                    
                    const query = searchInput.value.trim();
                    const filtered = query ? filterProtocols(query) : PROTOCOLS;
                    renderProtocolList(filtered);
                    
                    if (expandedProtocolId) {
                        const expandedElement = document.querySelector(`.protocol-item[data-id="${expandedProtocolId}"]`);
                        if (expandedElement) {
                            setTimeout(() => {
                                expandedElement.scrollIntoView({ block: 'center', behavior: 'smooth' });
                            }, 100);
                        }
                    }
                });
            });
        }

        // ---- ФИЛЬТРАЦИЯ ----
        function filterProtocols(query) {
            if (!query || query.trim() === '') {
                return PROTOCOLS;
            }

            const q = query.toLowerCase().trim();
            return PROTOCOLS.filter((proto) => {
                const nameMatch = proto.name.toLowerCase().includes(q);
                const abbrMatch = proto.abbreviation.toLowerCase().includes(q);
                const idMatch = proto.id.toLowerCase().includes(q);
                return nameMatch || abbrMatch || idMatch;
            });
        }

        // ---- ОБНОВЛЕНИЕ ПОИСКА ----
        function updateSearch() {
            const query = searchInput.value;
            
            if (query.trim() === '') {
                clearButton.classList.remove('visible');
            } else {
                clearButton.classList.add('visible');
            }

            const filtered = filterProtocols(query);
            renderProtocolList(filtered);
        }

        // ---- ОЧИСТКА ----
        function clearSearch() {
            searchInput.value = '';
            searchInput.focus();
            clearButton.classList.remove('visible');
            expandedProtocolId = null;
            renderProtocolList(PROTOCOLS);
        }

        // ---- ПРИНУДИТЕЛЬНЫЙ СБРОС КЭША ----
        function forceClearCache() {
            const version = localStorage.getItem('protocol_viewer_version') || '0';
            const newVersion = '4.0.1';
            localStorage.setItem('protocol_viewer_version', newVersion);
            console.log(`🔄 Принудительный сброс кэша: ${version} → ${newVersion}`);

            if ('caches' in window) {
                caches.keys().then(function(names) {
                    for (let name of names) {
                        caches.delete(name);
                    }
                });
            }

            const btn = document.getElementById('clearCacheBtn');
            const originalText = btn.textContent;
            btn.textContent = '✅ Обновлено!';
            btn.style.background = '#4d6bfe';
            btn.style.color = 'white';
            setTimeout(() => {
                btn.textContent = originalText;
                btn.style.background = '';
                btn.style.color = '';
            }, 2000);

            setTimeout(() => {
                window.location.reload(true);
            }, 1000);
        }

        // ---- СОБЫТИЯ ----
        searchInput.addEventListener('input', updateSearch);
        clearButton.addEventListener('click', clearSearch);
        if (clearCacheBtn) {
            clearCacheBtn.addEventListener('click', forceClearCache);
        }

        // ---- ИНИЦИАЛИЗАЦИЯ ----
        renderProtocolList(PROTOCOLS);
        console.log('✅ Protocol Viewer v4.0 готов к работе!');
    });
    </script>
</body>
</html>
