<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProtoViewer — Network Protocols Reference</title>
    <link rel="stylesheet" href="styles.css?v=8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="header-content">
                <h1 class="header-title">What protocol is this?</h1>
                <p class="header-subtitle">Network Protocols Reference</p>
            </div>
        </header>

        <main class="main-content">
            <section class="search-section">
                <div class="search-wrapper">
                    <div class="search-input-container">
                        <span class="search-icon">🔍</span>
                        <input
                            type="text"
                            id="searchInput"
                            class="search-input"
                            placeholder="Search by name or abbreviation..."
                            autocomplete="off"
                        />
                        <button id="clearButton" class="clear-button" aria-label="Clear">✕</button>
                    </div>
                </div>
            </section>

            <section id="protocolList" class="protocol-list-container">
                <!-- List will be rendered by JS -->
            </section>
        </main>

        <footer class="app-footer">
            <p>Data is manually maintained. All protocols include links to official specifications.</p>
            <button id="clearCacheBtn" class="cache-clear-btn" title="Force refresh protocol data">
                🔄 Refresh data
            </button>
        </footer>
    </div>

    <script src="protocols.js?v=8"></script>
    <script src="script.js?v=8"></script>
</body>
</html>
